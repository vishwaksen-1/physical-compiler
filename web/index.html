<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physical Compiler – Equation Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>⚙️ Physical Compiler</h1>
    <p>Deterministic DiffEq → Physical Experiment</p>
  </header>

  <main>
    <section id="builder">
      <h2>Equation Builder</h2>
      <form id="equation-form">
        <!-- Order -->
        <div class="field">
          <label for="order">Order</label>
          <select id="order" name="order">
            <option value="1">1st</option>
            <option value="2" selected>2nd</option>
          </select>
        </div>

        <!-- Coefficients (dynamically generated) -->
        <div id="coefficients-container">
          <!-- filled by JS -->
        </div>

        <!-- Forcing -->
        <div class="field">
          <label for="forcing-type">Forcing type</label>
          <select id="forcing-type" name="forcing-type">
            <option value="zero">Zero</option>
            <option value="const">Constant</option>
            <option value="sin">Sine</option>
            <option value="cos">Cosine</option>
            <option value="step">Step</option>
            <option value="impulse">Impulse</option>
            <option value="polynomial">Polynomial</option>
            <option value="custom_expr">Custom expression</option>
          </select>
        </div>

        <div id="forcing-params" class="field-group">
          <!-- extra params for forcing, shown conditionally -->
        </div>

        <!-- Initial conditions -->
        <div id="initial-conditions" class="field-group">
          <h4>Initial conditions</h4>
          <div class="field">
            <label for="y0">y(0)</label>
            <input type="number" id="y0" name="y0" step="any" value="0" />
          </div>
          <div class="field" id="yprime0-container">
            <label for="yprime0">y'(0)</label>
            <input type="number" id="yprime0" name="yprime0" step="any" value="0" />
          </div>
        </div>

        <button type="submit">Compile</button>
      </form>
    </section>

    <section id="results" style="display: none;">
      <h2>Experiment Output</h2>
      <div id="results-content"></div>
    </section>
  </main>

  <script src="builder.js"></script>
  <script src="viewer.js"></script>
  <script src="app.js"></script>
</body>
</html>
